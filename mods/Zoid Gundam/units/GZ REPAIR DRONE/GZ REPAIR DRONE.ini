[core]
name: GZ REPAIR DRONE
displayText: GZ Nano-Swarm
displayDescription: -Hovering cloud of Alliance nanobots around a fabricator core\n-Builds all Gundam, Zeon & Zoids Factories, Extractors & Turrets\n-Nano beam repair, reclaim & light point-defense
tags: infantry, minesweeper
class: CustomUnitMetadata
price: 900
maxHp: 462
maxShield: 165
shieldRegen: 0.18
mass: 400
techLevel: 1
buildSpeed: 7s
availableInDemo: true
radius: 9
displayRadius: 9
isBio: false
isBuilder: true
selfRegenRate: 0.08
softCollisionOnAll: 5
fogOfWarSightRange: 20
canRepairBuildings: true
canRepairUnits: true
canReclaimResources: true
autoRepair: true
nanoRange: 155
nanoRepairSpeed: 0.25
nanoBuildSpeed: 1.35
builtFrom_1_name: commandCenter, Zoids Gundam Alliance, HQ RESTORED, G-INF, Z-INF, GFACTORY, GFACTORY_T2, ZFACTORY, ZFACTORY_T2
builtFrom_1_pos: 1.0

[canBuild_1]
name: repair, reclaim, extractorT1, fabricatorT1, c_turret_t1, c_antiAirTurret, antiAirTurretFlak

[canBuild_2]
name: GFACTORY, G-AIR, G-INF, ZFACTORY, ZAIR, Z-INF, Zoids Gundam Alliance

[graphics]
total_frames: 3
image: anim.png
image_wreak: corpse.png
image_turret: NONE
imageScale: 0.54
image_shadow: AUTO
shadowOffsetX: 3
shadowOffsetY: 3

[attack]
canAttack: true
canAttackFlyingUnits: true
canAttackLandUnits: true
canAttackUnderwaterUnits: false
turretSize: 1
turretTurnSpeed: 12
maxAttackRange: 116
shootDelay: 18

# Invisible emitter at the fabricator core - fires the nano beam
[turret_1]
x: 0
y: 0
invisible: true
projectile: nanoBeam
turnSpeed: 12
shoot_sound: plasma_fire
shoot_sound_vol: 0.1

[turret_nano]
x: 0
y: 0
canShoot: false
invisible: true
isMainNanoTurret: true

[projectile_nanoBeam]
directDamage: 7
life: 14
instant: true
beamImage: SHARED:beam2.png
beamImageStart: SHARED:beam1_start.png
beamImageEnd: SHARED:beam1_end.png
color: #FF55eeff
drawSize: 0.5

# 6 orbiting nanobots (ring of radius ~9 around the core)
[arm_1]
x: 0
y: -9.7
image_end: nanobot.png
drawOverBody: true

[arm_2]
x: 8.6
y: -4.3
image_end: nanobot.png
drawOverBody: true

[arm_3]
x: 8.6
y: 4.3
image_end: nanobot.png
drawOverBody: true

[arm_4]
x: 0
y: 9.7
image_end: nanobot.png
drawOverBody: true

[arm_5]
x: -8.6
y: 4.3
image_end: nanobot.png
drawOverBody: true

[arm_6]
x: -8.6
y: -4.3
image_end: nanobot.png
drawOverBody: true

# Idle: slow drift one slot clockwise and back
[animation_idle]
onActions: idle
pingPong: true
arm1_0s: {x:0, y:0, dir:0}
arm2_0s: {x:0, y:0, dir:0}
arm3_0s: {x:0, y:0, dir:0}
arm4_0s: {x:0, y:0, dir:0}
arm5_0s: {x:0, y:0, dir:0}
arm6_0s: {x:0, y:0, dir:0}
arm1_1.4s: {x:8, y:5, dir:60}
arm2_1.4s: {x:0, y:8, dir:60}
arm3_1.4s: {x:-8, y:5, dir:60}
arm4_1.4s: {x:-8, y:-5, dir:60}
arm5_1.4s: {x:0, y:-8, dir:60}
arm6_1.4s: {x:8, y:-5, dir:60}

# Move: faster, tighter swirl that trails slightly behind the core
[animation_move]
onActions: move
pingPong: true
arm1_0s: {x:0, y:2, dir:0}
arm2_0s: {x:-2, y:2, dir:0}
arm3_0s: {x:-2, y:1, dir:0}
arm4_0s: {x:0, y:-1, dir:0}
arm5_0s: {x:2, y:1, dir:0}
arm6_0s: {x:2, y:2, dir:0}
arm1_0.6s: {x:6, y:6, dir:60}
arm2_0.6s: {x:-1, y:7, dir:60}
arm3_0.6s: {x:-7, y:3, dir:60}
arm4_0.6s: {x:-6, y:-3, dir:60}
arm5_0.6s: {x:1, y:-5, dir:60}
arm6_0.6s: {x:7, y:-2, dir:60}

[movement]
movementType: HOVER
moveSpeed: 1.11
moveAccelerationSpeed: 0.072
moveDecelerationSpeed: 0.22
maxTurnSpeed: 7.5
turnAcceleration: 0.8
moveSlidingMode: true
moveIgnoringBody: false

[ai]
useAsBuilder: true
