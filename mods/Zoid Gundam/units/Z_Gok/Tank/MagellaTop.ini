[core]
name: Magella Top
displayText: Magella Top (VTOL)
displayDescription: -Detached VTOL Flying 175mm Cannon Turret\n-Can re-land on solid ground to restore tank armor
class: CustomUnitMetadata
showInEditor: false
price: 800
maxHp: 580
armour: 2
mass: 1400
techLevel: 1
buildSpeed: 12s
radius: 11
displayRadius: 11
isBio: false
softCollisionOnAll: 16
fogOfWarSightRange: 21

[action_landTank]
text: Re-Deploy Chassis
description: -Lands on solid ground and restores heavy Magella tank chassis
displayType: action
buildSpeed: 1.2s
pos: 0.1
isActive: if not self.isOverWater()
convertTo: Zeon Tank
whenBuilding_cannotMove: true
allowMultipleInQueue: false
alwaysSinglePress: true

[graphics]
turretImageScale: 0.50
total_frames: 1
image: magella_top.png
image_wreak: NONE
image_turret: NONE
imageScale: 0.50
image_shadow: AUTO
shadowOffsetX: 2
shadowOffsetY: 2
lock_body_rotation_with_main_turret: true

[attack]
canAttack: true
canAttackFlyingUnits: true
canAttackLandUnits: true
canAttackUnderwaterUnits: false
turretSize: 8
turretTurnSpeed: 7
maxAttackRange: 235
shootDelay: 34

[turret_1]
x: 0
y: 6
invisible: true
projectile: vtol175
turnSpeed: 10
shoot_sound: tank_firing
shoot_sound_vol: 0.25
shoot_flame: large

[projectile_vtol175]
directDamage: 46
areaDamage: 32
areaRadius: 30
life: 100
speed: 9.5
largeHitEffect: true
frame: 2
drawSize: 0.9

[arm_1]
x: -7
y: -2
image_end: vtol_wing_l.png
drawOverBody: false

[arm_2]
x: 7
y: -2
image_end: vtol_wing_r.png
drawOverBody: false

[movement]
movementType: AIR
targetHeight: 18
targetHeightDrift: 1.5
moveSpeed: 2.2
moveAccelerationSpeed: 0.08
moveDecelerationSpeed: 0.12
maxTurnSpeed: 5.5
turnAcceleration: 0.45
moveSlidingMode: true
moveIgnoringBody: true
slowDeathFall: true




